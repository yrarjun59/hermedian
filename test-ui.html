<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hermedian Composer Test</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center p-4">

  <!-- Main Container - Matches Hermes Desktop -->
  <div class="w-full max-w-4xl bg-[#0e0e0e] border border-gray-800 rounded-2xl overflow-hidden flex flex-col h-[80vh] shadow-xl">
    
    <!-- Header -->
    <div class="flex items-center justify-between px-4 py-3 border-b border-gray-800 bg-gray-900">
      <div class="flex items-center gap-3">
        <span class="font-semibold text-white text-lg">Hermedian</span>
        <span class="px-3 py-1 text-xs font-medium rounded-full bg-green-500/20 text-green-400 border border-green-500/30">
          Connected
        </span>
      </div>
      <div class="flex items-center gap-2">
        <button class="p-2 text-gray-400 hover:bg-gray-800 rounded-lg transition" title="New conversation">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.5v15m7.5-7.5h-15" /></svg>
        </button>
        <button class="p-2 text-gray-400 hover:bg-gray-800 rounded-lg transition" title="History">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
        </button>
        <button class="p-2 text-gray-400 hover:bg-gray-800 rounded-lg transition" title="Settings">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
        </button>
      </div>
    </div>

    <!-- Messages Area -->
    <div class="flex-1 overflow-y-auto p-4 space-y-4" id="messages">
      <div class="flex justify-start">
        <div class="bg-gray-800 border border-gray-700 rounded-2xl px-4 py-3 max-w-[85%] rounded-bl-sm">
          <p class="text-gray-200">Hello! I'm Hermes Agent, your AI coding assistant. I can read, write, and edit files in your vault. How can I help?</p>
        </div>
      </div>
    </div>

    <!-- Composer - Exact Hermes Desktop Layout -->
    <div class="flex items-center px-4 py-3 border-t border-gray-800 bg-gray-900 gap-3" id="composer">
      <!-- Attach Button -->
      <button class="w-9 h-9 rounded-full bg-transparent text-gray-400 hover:bg-gray-800 flex items-center justify-center transition" title="Attach files">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.5v15m7.5-7.5h-15" /></svg>
      </button>

      <!-- Input Field -->
      <textarea 
        id="input" 
        placeholder="Ask Hermes... (Shift+Enter for newline)"
        class="flex-1 bg-gray-800 border border-gray-700 rounded-xl px-4 py-2.5 text-white placeholder-gray-500 outline-none text-lg px-2 min-w-0" 
        style="min-height: 44px; max-height: 150px;"
      ></textarea>

      <!-- Model Selector -->
      <select id="modelSelect" class="px-3 py-2 bg-gray-800 border border-gray-700 rounded-lg text-white text-sm font-medium min-w-[140px] max-w-[180px] focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-500/20">
        <optgroup label="── NVIDIA NIM ──">
          <option value="nvidia/llama-3.1-nemotron-70b-instruct">Llama 3.1 Nemotron 70B</option>
          <option value="nvidia/nemotron-3-ultra-550b-a55b">Nemotron 3 Ultra (550B)</option>
          <option value="nvidia/nemotron-3-super-120b-a12b">Nemotron 3 Super (120B)</option>
        </optgroup>
        <optgroup label="── NOUS RESEARCH ──">
          <option value="hermes-3-70b">Hermes 3 70B</option>
          <option value="hermes-3-8b">Hermes 3 8B</option>
        </optgroup>
      </select>

      <!-- Provider Selector -->
      <select id="providerSelect" class="px-3 py-2 bg-gray-800 border border-gray-700 rounded-lg text-white text-sm font-medium min-w-[110px] max-w-[140px] focus:outline-none focus:border-purple-500">
        <option value="nvidia-nim">NVIDIA NIM</option>
        <option value="nous" selected>Nous Research</option>
        <option value="opencode-free">OpenCode Free</option>
        <option value="xai">xAI Grok</option>
        <option value="google">Google Gemini</option>
      </select>

      <!-- Reasoning Selector -->
      <select id="reasoningSelect" class="px-3 py-2 bg-gray-800 border border-gray-700 rounded-lg text-white text-sm font-medium min-w-[90px] max-w-[110px] focus:outline-none focus:border-purple-500">
        <option value="none">None</option>
        <option value="minimal">Minimal</option>
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
        <option value="xhigh">High+</option>
        <option value="max">Max</option>
        <option value="ultra">Ultra</option>
      </select>

      <!-- Send/Stop Button -->
      <button id="sendBtn" class="w-9 h-9 rounded-full bg-white text-black flex items-center justify-center hover:bg-gray-200 active:scale-95 transition-all" title="Send">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4.5 10.5 12 3m0 0 7.5 7.5M12 3v18" /></svg>
      </button>
    </div>
  </div>

  <script>
    // Simulate send/stop toggle
    const sendBtn = document.getElementById('sendBtn');
    const input = document.getElementById('input');
    let isProcessing = false;

    sendBtn.addEventListener('click', () => {
      isProcessing = !isProcessing;
      if (isProcessing) {
        sendBtn.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12" /></svg>';
        sendBtn.classList.remove('bg-white', 'text-black', 'hover:bg-gray-200');
        sendBtn.classList.add('bg-red-500', 'text-white', 'hover:bg-red-600');
        sendBtn.title = 'Stop generation';
        input.disabled = true;
      } else {
        sendBtn.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4.5 10.5 12 3m0 0 7.5 7.5M12 3v18" /></svg>';
        sendBtn.classList.remove('bg-red-500', 'text-white', 'hover:bg-red-600');
        sendBtn.classList.add('bg-white', 'text-black', 'hover:bg-gray-200');
        sendBtn.title = 'Send';
        input.disabled = false;
        input.focus();
      }
    });

    // Enter to send, Shift+Enter for newline
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (!isProcessing) sendBtn.click();
      }
    });

    // Provider change -> update model (simulated)
    document.getElementById('providerSelect').addEventListener('change', () => {
      console.log('Provider changed to:', providerSelect.value);
      // In real app, this would update model dropdown
    });

    // Reasoning change
    document.getElementById('reasoningSelect').addEventListener('change', () => {
      console.log('Reasoning changed to:', reasoningSelect.value);
    });
  </script>
</body>
</html>
